<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планування торгового залу — Марафон</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOOLBAR */
  #toolbar {
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
    z-index: 100;
  }

  .toolbar-section {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-right: 1px solid #0f3460;
  }
  .toolbar-section:last-child { border-right: none; }

  .toolbar-label {
    font-size: 11px;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }

  #custom-color {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px dashed #8892b0;
    background: transparent;
    padding: 0;
    overflow: hidden;
  }

  .input-field {
    background: #0f3460;
    border: 1px solid #1a4a7a;
    border-radius: 6px;
    padding: 5px 9px;
    color: #e0e0e0;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: #4fc3f7; }
  .input-field::placeholder { color: #546e7a; }

  .btn {
    background: #0f3460;
    border: 1px solid #1a4a7a;
    border-radius: 6px;
    padding: 5px 12px;
    color: #e0e0e0;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn:hover { background: #1a4a7a; }
  .btn.danger { border-color: #c0392b; color: #e74c3c; }
  .btn.danger:hover { background: #2d0a08; }
  .btn.primary { background: #0d7377; border-color: #0d7377; color: #fff; }
  .btn.primary:hover { background: #0a5d60; }

  #opacity-slider {
    width: 80px;
    accent-color: #4fc3f7;
  }

  /* MAIN AREA */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* CANVAS AREA */
  #canvas-wrapper {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #111827;
    cursor: crosshair;
  }

  #canvas-container {
    position: relative;
    display: inline-block;
    transform-origin: top left;
  }

  #floor-img {
    display: block;
    user-select: none;
    pointer-events: none;
  }

  #overlay-svg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: all;
  }

  /* ZONES */
  .zone-rect {
    cursor: pointer;
    transition: filter 0.15s;
  }
  .zone-rect:hover { filter: brightness(1.2); }
  .zone-rect.selected { filter: brightness(1.3) drop-shadow(0 0 4px rgba(255,255,255,0.6)); }

  /* SIDEBAR */
  #sidebar {
    width: 260px;
    background: #16213e;
    border-left: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 12px 14px;
    border-bottom: 1px solid #0f3460;
    font-size: 13px;
    font-weight: 600;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #zones-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .zone-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .zone-item:hover { background: #0f2044; }
  .zone-item.selected { background: #0f2044; border-color: #4fc3f7; }

  .zone-color-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .zone-info {
    flex: 1;
    overflow: hidden;
  }

  .zone-brand {
    font-size: 13px;
    font-weight: 600;
    color: #cdd6f4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .zone-sku {
    font-size: 11px;
    color: #6272a4;
  }

  .zone-delete {
    opacity: 0;
    cursor: pointer;
    color: #e74c3c;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
    transition: opacity 0.15s;
  }
  .zone-item:hover .zone-delete { opacity: 1; }

  /* PROPERTIES PANEL */
  #properties-panel {
    padding: 12px;
    border-top: 1px solid #0f3460;
    background: #0d1b36;
  }
  #properties-panel h3 {
    font-size: 12px;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .prop-row {
    margin-bottom: 8px;
  }
  .prop-label {
    font-size: 11px;
    color: #6272a4;
    margin-bottom: 3px;
  }
  .prop-input {
    width: 100%;
    background: #0f3460;
    border: 1px solid #1a4a7a;
    border-radius: 5px;
    padding: 5px 8px;
    color: #e0e0e0;
    font-size: 13px;
    outline: none;
  }
  .prop-input:focus { border-color: #4fc3f7; }

  /* ZOOM */
  #zoom-controls {
    position: fixed;
    bottom: 16px;
    right: 276px;
    display: flex;
    gap: 4px;
    z-index: 50;
  }
  .zoom-btn {
    width: 32px;
    height: 32px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .zoom-btn:hover { background: #1a4a7a; }

  #zoom-label {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 12px;
    color: #8892b0;
    display: flex;
    align-items: center;
  }

  /* Upload overlay */
  #upload-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,30,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    flex-direction: column;
    gap: 20px;
  }

  .upload-box {
    background: #16213e;
    border: 2px dashed #0f3460;
    border-radius: 16px;
    padding: 48px 64px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    max-width: 480px;
    width: 90%;
  }
  .upload-box:hover, .upload-box.drag-over {
    border-color: #4fc3f7;
    background: #0d2040;
  }
  .upload-icon { font-size: 48px; margin-bottom: 16px; }
  .upload-title {
    font-size: 20px;
    font-weight: 700;
    color: #cdd6f4;
    margin-bottom: 8px;
  }
  .upload-sub {
    font-size: 14px;
    color: #6272a4;
  }
  .upload-or {
    font-size: 12px;
    color: #8892b0;
    margin: 14px 0;
  }

  #mode-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0d2040;
    border: 1px solid #1a4a7a;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #4fc3f7;
  }
  #mode-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4fc3f7;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Drawing cursor overlay */
  #drawing-hint {
    display: none;
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(79,195,247,0.15);
    border: 1px solid #4fc3f7;
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 12px;
    color: #4fc3f7;
    z-index: 50;
    pointer-events: none;
  }

  /* TYPE / GENDER badges */
  .zone-meta {
    font-size: 10px;
    color: #6272a4;
    margin-top: 1px;
  }
  .badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    margin-right: 2px;
  }
  .badge-S { background: #1a4a7a; color: #4fc3f7; }
  .badge-A { background: #2d1a4a; color: #c678dd; }
  .badge-M { background: #1a3a1a; color: #98c379; }
  .badge-W { background: #3a1a2a; color: #e06c75; }

  /* Summary table in sidebar */
  #summary-section {
    border-top: 1px solid #0f3460;
    flex-shrink: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  #summary-header {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #summary-header:hover { background: #0f2044; }
  #summary-table-wrap { padding: 0 8px 8px; }
  .sum-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
  }
  .sum-table th {
    background: #0f3460;
    color: #8892b0;
    padding: 3px 5px;
    text-align: center;
    font-weight: 600;
    font-size: 9px;
    letter-spacing: 0.3px;
  }
  .sum-table th.brand-col { text-align: left; }
  .sum-table td {
    padding: 3px 5px;
    text-align: center;
    color: #cdd6f4;
    border-bottom: 1px solid #0f3460;
    font-size: 10px;
  }
  .sum-table td.brand-col { text-align: left; font-weight: 600; }
  .sum-table tr.total-row td { background: #0f3460; color: #4fc3f7; font-weight: 700; }
  .sum-table tr:hover td { background: #0f2044; }


  /* Multi-select */
  .zone-rect.multi-selected {
    stroke-dasharray: 6,3;
    filter: brightness(1.25) drop-shadow(0 0 3px rgba(255,255,255,0.5));
  }
  /* Group items in sidebar */
  .group-item {
    background: #0a1e3a;
    border: 1px solid #1a4a7a;
    border-radius: 6px;
    margin-bottom: 4px;
    overflow: hidden;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    cursor: pointer;
  }
  .group-header:hover { background: #0f2044; }
  .group-zones {
    padding: 0 8px 6px 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .group-zone-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #8892b0;
    padding: 2px 0;
  }
  .group-zone-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .btn.success { background: #0d5c2e; border-color: #0d7337; color: #fff; }
  .btn.success:hover { background: #0a4a25; }

</style>
</head>
<body>

<!-- UPLOAD OVERLAY (shown initially or when no custom PDF) -->
<div id="upload-overlay">
  <div class="upload-box" id="upload-box" onclick="document.getElementById('pdf-file-input').click()">
    <div class="upload-icon">📋</div>
    <div class="upload-title">Завантажте план магазину</div>
    <div class="upload-sub">PDF або зображення (PNG, JPG)</div>
    <div class="upload-or">— або —</div>
    <button class="btn primary" onclick="loadDefaultPlan(event)">Відкрити план Івано-Франківськ</button>
  </div>
  <input type="file" id="pdf-file-input" accept=".pdf,.png,.jpg,.jpeg" style="display:none" onchange="handleFileUpload(event)">
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <div class="toolbar-section">
    <span class="toolbar-label">Колір зони</span>
    <div class="color-swatch active" style="background:#ef5350" data-color="#ef5350" onclick="selectColor(this)" title="Червоний"></div>
    <div class="color-swatch" style="background:#42a5f5" data-color="#42a5f5" onclick="selectColor(this)" title="Синій"></div>
    <div class="color-swatch" style="background:#66bb6a" data-color="#66bb6a" onclick="selectColor(this)" title="Зелений"></div>
    <div class="color-swatch" style="background:#ffa726" data-color="#ffa726" onclick="selectColor(this)" title="Помаранчевий"></div>
    <div class="color-swatch" style="background:#ab47bc" data-color="#ab47bc" onclick="selectColor(this)" title="Фіолетовий"></div>
    <div class="color-swatch" style="background:#26c6da" data-color="#26c6da" onclick="selectColor(this)" title="Блакитний"></div>
    <div class="color-swatch" style="background:#ffca28" data-color="#ffca28" onclick="selectColor(this)" title="Жовтий"></div>
    <div class="color-swatch" style="background:#ec407a" data-color="#ec407a" onclick="selectColor(this)" title="Рожевий"></div>
    <div class="color-swatch" style="background:#8d6e63" data-color="#8d6e63" onclick="selectColor(this)" title="Коричневий"></div>
    <input type="color" id="custom-color" title="Власний колір" onchange="selectCustomColor(this.value)">
  </div>
  
  <div class="toolbar-section">
    <span class="toolbar-label">Прозорість</span>
    <input type="range" id="opacity-slider" min="10" max="90" value="45" oninput="updateOpacity(this.value)">
    <span id="opacity-value" style="font-size:12px;color:#8892b0;min-width:28px">45%</span>
  </div>

  <div class="toolbar-section">
    <span class="toolbar-label">Бренд</span>
    <input type="text" id="brand-input" class="input-field" placeholder="Adidas" style="width:110px" list="brand-suggestions">
    <datalist id="brand-suggestions">
      <option value="Adidas">
      <option value="Nike">
      <option value="Puma">
      <option value="New Balance">
      <option value="Columbia">
      <option value="Reebok">
      <option value="Skechers">
      <option value="Camel">
      <option value="Kaytrі">
      <option value="Salomon">
      <option value="Hoka">
      <option value="The North Face">
      <option value="Jack Wolfskin">
    </datalist>
  </div>

  <div class="toolbar-section">
    <span class="toolbar-label">Арт.</span>
    <input type="number" id="sku-input" class="input-field" placeholder="24" style="width:70px" min="1">
  </div>

  <div class="toolbar-section">
    <span class="toolbar-label">Тип</span>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#e0e0e0">
      <input type="radio" name="zone-type" value="S" id="type-S" checked style="accent-color:#4fc3f7"> 👟 Shoes
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#e0e0e0">
      <input type="radio" name="zone-type" value="A" id="type-A" style="accent-color:#c678dd"> 👕 Apparel
    </label>
  </div>

  <div class="toolbar-section">
    <span class="toolbar-label">Стать</span>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#e0e0e0">
      <input type="radio" name="zone-gender" value="M" id="gender-M" checked style="accent-color:#98c379"> M
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#e0e0e0">
      <input type="radio" name="zone-gender" value="W" id="gender-W" style="accent-color:#e06c75"> W
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#e0e0e0">
      <input type="radio" name="zone-gender" value="MW" id="gender-MW" style="accent-color:#4fc3f7"> M+W
    </label>
  </div>

  <div class="toolbar-section">
    <div id="mode-indicator">
      <div id="mode-dot"></div>
      <span id="mode-text">Малювання зон</span>
    </div>
  </div>

  <div class="toolbar-section">
    <button class="btn" onclick="clearSelection()" title="Скасувати виділення">✕ Скасувати</button>
    <button class="btn success" onclick="groupSelected()" id="group-btn" style="display:none" title="Об'єднати виділені зони в групу">🔗 Згрупувати</button>
    <button class="btn danger" onclick="ungroupSelected()" id="ungroup-btn" style="display:none" title="Розгрупувати">✂️ Розгрупувати</button>
    <button class="btn danger" onclick="deleteSelected()" id="delete-btn" style="display:none">🗑 Видалити</button>
  </div>

  <div class="toolbar-section">
    <button class="btn" style="background:#0d5c2e;border-color:#0d7337;color:#fff" onclick="saveProject()">💾 Зберегти проект</button>
    <button class="btn" onclick="document.getElementById('load-project-input').click()">📂 Завантажити проект</button>
    <input type="file" id="load-project-input" accept=".json" style="display:none" onchange="loadProject(event)">
    <button class="btn primary" onclick="exportImage()">🖼 PNG</button>
    <button class="btn primary" onclick="exportPDF()" style="background:#1a6b3c;border-color:#1a6b3c">📄 PDF</button>
    <button class="btn" onclick="document.getElementById('pdf-file-input').click()">📋 Інший план</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="canvas-wrapper">
    <div id="canvas-container">
      <img id="floor-img" src="" alt="Floor Plan" ondragstart="return false">
      <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="drawing-hint">Клікніть та тягніть, щоб намалювати зону</div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">Зони <span id="zone-count" style="color:#4fc3f7">0</span></div>
    <div id="zones-list-wrap" style="flex:1;overflow-y:auto;">
      <div id="zones-list"></div>
    </div>
    <div id="summary-section">
      <div id="summary-header" onclick="toggleSummary()">
        <span>Зведена таблиця</span>
        <span id="summary-toggle">▼</span>
      </div>
      <div id="summary-table-wrap" style="display:none"></div>
    </div>
    <div id="properties-panel" style="display:none">
      <h3>Властивості зони</h3>
      <div class="prop-row">
        <div class="prop-label">Бренд</div>
        <input type="text" class="prop-input" id="prop-brand" oninput="updateSelectedZone()">
      </div>
      <div class="prop-row">
        <div class="prop-label">Артикули (шт.)</div>
        <input type="number" class="prop-input" id="prop-sku" oninput="updateSelectedZone()" min="1">
      </div>
      <div class="prop-row">
        <div class="prop-label">Тип</div>
        <div style="display:flex;gap:12px;">
          <label style="font-size:12px;color:#e0e0e0;cursor:pointer;">
            <input type="radio" name="prop-type" value="S" id="prop-type-S" onchange="updateSelectedZone()"> Shoes
          </label>
          <label style="font-size:12px;color:#e0e0e0;cursor:pointer;">
            <input type="radio" name="prop-type" value="A" id="prop-type-A" onchange="updateSelectedZone()"> Apparel
          </label>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-label">Стать</div>
        <div style="display:flex;gap:8px;">
          <label style="font-size:12px;color:#e0e0e0;cursor:pointer;">
            <input type="radio" name="prop-gender" value="M" id="prop-gender-M" onchange="updateSelectedZone()"> M
          </label>
          <label style="font-size:12px;color:#e0e0e0;cursor:pointer;">
            <input type="radio" name="prop-gender" value="W" id="prop-gender-W" onchange="updateSelectedZone()"> W
          </label>
          <label style="font-size:12px;color:#e0e0e0;cursor:pointer;">
            <input type="radio" name="prop-gender" value="MW" id="prop-gender-MW" onchange="updateSelectedZone()"> M+W
          </label>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-label">Колір</div>
        <input type="color" class="prop-input" id="prop-color" style="height:32px;padding:2px 4px" oninput="updateSelectedZoneColor()">
      </div>
    </div>
  </div>
</div>

<div id="zoom-controls">
  <button class="zoom-btn" onclick="zoom(-0.1)">−</button>
  <div id="zoom-label">100%</div>
  <button class="zoom-btn" onclick="zoom(0.1)">+</button>
  <button class="zoom-btn" onclick="resetZoom()" title="По розміру вікна">⊞</button>
</div>

<script>
// ============================================================

// ============================================================
// INIT
// ============================================================
function loadDefaultPlan(e) {
  e && e.stopPropagation();
  document.getElementById("upload-overlay").style.display = "none";
  loadImageToCanvas(FLOORPLAN_DEFAULT);
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById("upload-overlay").style.display = "none";
  
  if (file.type === "application/pdf") {
    // For PDF: use PDF.js to render
    const fr = new FileReader();
    fr.onload = function(ev) {
      renderPdfToCanvas(ev.target.result);
    };
    fr.readAsArrayBuffer(file);
  } else {
    const url = URL.createObjectURL(file);
    loadImageToCanvas(url);
  }
}

function loadImageToCanvas(src) {
  const img = document.getElementById("floor-img");
  img.onload = function() {
    imgNatW = img.naturalWidth;
    imgNatH = img.naturalHeight;
    const svg = document.getElementById("overlay-svg");
    svg.setAttribute("width", imgNatW);
    svg.setAttribute("height", imgNatH);
    svg.setAttribute("viewBox", `0 0 ${imgNatW} ${imgNatH}`);
    fitToWindow();
  };
  img.src = src;
}

// ============================================================
// PDF.js rendering
// ============================================================
async function renderPdfToCanvas(arrayBuffer) {
  // Load PDF.js from CDN
  if (!window.pdfjsLib) {
    await new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = resolve;
      document.head.appendChild(s);
    });
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2.0 });
  
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  
  loadImageToCanvas(canvas.toDataURL("image/jpeg", 0.92));
}

// ============================================================
// ZOOM
// ============================================================
function zoom(delta) {
  currentScale = Math.max(0.2, Math.min(4, currentScale + delta));
  applyScale();
}

function resetZoom() {
  fitToWindow();
}

function fitToWindow() {
  const wrapper = document.getElementById("canvas-wrapper");
  const ww = wrapper.clientWidth - 20;
  const wh = wrapper.clientHeight - 20;
  const sx = ww / imgNatW;
  const sy = wh / imgNatH;
  currentScale = Math.min(sx, sy);
  applyScale();
}

function applyScale() {
  document.getElementById("canvas-container").style.transform = `scale(${currentScale})`;
  document.getElementById("zoom-label").textContent = Math.round(currentScale * 100) + "%";
}

// ============================================================
// COLOR & OPACITY
// ============================================================
function selectColor(el) {
  document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
  el.classList.add("active");
  currentColor = el.dataset.color;
}

function selectCustomColor(val) {
  document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
  currentColor = val;
}

function updateOpacity(val) {
  currentOpacity = val / 100;
  document.getElementById("opacity-value").textContent = val + "%";
}

// ============================================================
// DRAWING
// ============================================================
const svg = document.getElementById("overlay-svg");
let tempRect = null;

function getSVGCoords(e) {
  const img = document.getElementById("floor-img");
  const rect = img.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / currentScale,
    y: (e.clientY - rect.top) / currentScale
  };
}

svg.addEventListener("mousedown", (e) => {
  if (e.target.closest(".zone-rect")) return; // clicking existing zone
  if (e.target.closest(".label-group")) return; // clicking label
  if (e.shiftKey) return; // shift = multi-select mode, not drawing
  if (e.button !== 0) return;
  
  const coords = getSVGCoords(e);
  isDrawing = true;
  drawStart = coords;
  
  tempRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  tempRect.setAttribute("x", coords.x);
  tempRect.setAttribute("y", coords.y);
  tempRect.setAttribute("width", 0);
  tempRect.setAttribute("height", 0);
  tempRect.setAttribute("fill", currentColor);
  tempRect.setAttribute("fill-opacity", currentOpacity);
  tempRect.setAttribute("stroke", currentColor);
  tempRect.setAttribute("stroke-width", 2);
  tempRect.setAttribute("stroke-opacity", 0.9);
  svg.appendChild(tempRect);
  
  document.getElementById("drawing-hint").style.display = "block";
  e.preventDefault();
});

svg.addEventListener("mousemove", (e) => {
  if (!isDrawing || !tempRect) return;
  const coords = getSVGCoords(e);
  const x = Math.min(coords.x, drawStart.x);
  const y = Math.min(coords.y, drawStart.y);
  const w = Math.abs(coords.x - drawStart.x);
  const h = Math.abs(coords.y - drawStart.y);
  tempRect.setAttribute("x", x);
  tempRect.setAttribute("y", y);
  tempRect.setAttribute("width", w);
  tempRect.setAttribute("height", h);
});

svg.addEventListener("mouseup", (e) => {
  if (!isDrawing) return;
  isDrawing = false;
  document.getElementById("drawing-hint").style.display = "none";
  
  const coords = getSVGCoords(e);
  const w = Math.abs(coords.x - drawStart.x);
  const h = Math.abs(coords.y - drawStart.y);
  
  if (tempRect) { svg.removeChild(tempRect); tempRect = null; }
  
  if (w < 10 || h < 10) return; // too small
  
  const rawBrand = document.getElementById("brand-input").value.trim();
  const parsed = parseBrandInput(rawBrand);
  const brand = parsed.brand || "Бренд";
  const sku = parseInt(document.getElementById("sku-input").value) || 0;
  const ztype = parsed.type || document.querySelector('input[name="zone-type"]:checked')?.value || "S";
  const gender = parsed.gender || document.querySelector('input[name="zone-gender"]:checked')?.value || "M";
  
  const zone = {
    id: "z" + Date.now(),
    x: Math.min(coords.x, drawStart.x),
    y: Math.min(coords.y, drawStart.y),
    w, h,
    color: currentColor,
    opacity: currentOpacity,
    brand,
    sku,
    ztype,
    gender
  };
  
  zones.push(zone);
  renderZone(zone);
  renderSidebar();
  selectZone(zone.id);
});

// Touch support
svg.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  svg.dispatchEvent(new MouseEvent("mousedown", { clientX: t.clientX, clientY: t.clientY, button: 0 }));
}, {passive: false});
svg.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  svg.dispatchEvent(new MouseEvent("mousemove", { clientX: t.clientX, clientY: t.clientY }));
}, {passive: false});
svg.addEventListener("touchend", (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  svg.dispatchEvent(new MouseEvent("mouseup", { clientX: t.clientX, clientY: t.clientY }));
}, {passive: false});

// ============================================================
// RENDER ZONE
// ============================================================
function renderZone(zone) {
  // Helper: compute label dimensions
  function labelDims(zone) {
    const fontSize = Math.max(9, Math.min(18, zone.w / (zone.brand.length * 0.65 + 2)));
    const lineH = fontSize + 3;
    const metaLine = (zone.ztype || zone.gender) ? `${zone.ztype||"S"} ${zone.gender||"M"}` : null;
    const lines = [zone.brand, metaLine, zone.sku > 0 ? zone.sku + " SKU" : null].filter(Boolean);
    const bgH = lines.length * lineH + 6;
    const maxLen = Math.max(...lines.map(l => l.length));
    const bgW = Math.min(Math.max(zone.w * 0.8, 40), maxLen * fontSize * 0.62 + 16);
    return { fontSize, lineH, lines, bgH, bgW };
  }

  const { fontSize, lineH, lines, bgH, bgW } = labelDims(zone);

  // Default label position: outside zone, below-left
  if (zone.lx === undefined) {
    zone.lx = zone.x - bgW - 8;
    zone.ly = zone.y + zone.h / 2 - bgH / 2;
  }

  // 1. Connector line (zone center → label center), drawn first (behind everything)
  const lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
  lineEl.setAttribute("id", zone.id + "-line");
  lineEl.setAttribute("class", "zone-connector");
  lineEl.setAttribute("x1", zone.x + zone.w / 2);
  lineEl.setAttribute("y1", zone.y + zone.h / 2);
  lineEl.setAttribute("x2", zone.lx + bgW / 2);
  lineEl.setAttribute("y2", zone.ly + bgH / 2);
  lineEl.setAttribute("stroke", zone.color);
  lineEl.setAttribute("stroke-opacity", zone.opacity);
  lineEl.setAttribute("stroke-width", "1");
  lineEl.setAttribute("stroke-dasharray", "3,3");
  lineEl.style.pointerEvents = "none";
  svg.appendChild(lineEl);

  // 2. Zone rectangle — same opacity as label
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", zone.id);
  g.setAttribute("class", "zone-group");

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("class", "zone-rect");
  rect.setAttribute("x", zone.x);
  rect.setAttribute("y", zone.y);
  rect.setAttribute("width", zone.w);
  rect.setAttribute("height", zone.h);
  rect.setAttribute("fill", zone.color);
  rect.setAttribute("fill-opacity", zone.opacity);
  rect.setAttribute("stroke", zone.color);
  rect.setAttribute("stroke-width", 2.5);
  rect.setAttribute("stroke-opacity", zone.opacity);
  rect.setAttribute("rx", 3);
  rect.addEventListener("click", (e) => {
    e.stopPropagation();
    if (e.shiftKey) {
      toggleMultiSelect(zone.id);
    } else {
      clearMultiSelect();
      selectZone(zone.id);
    }
  });
  g.appendChild(rect);
  svg.appendChild(g);

  // 3. Label — same opacity as zone
  const lg = document.createElementNS("http://www.w3.org/2000/svg", "g");
  lg.setAttribute("id", zone.id + "-label");
  lg.setAttribute("class", "label-group");
  lg.style.cursor = "move";

  const lbg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  lbg.setAttribute("x", zone.lx);
  lbg.setAttribute("y", zone.ly);
  lbg.setAttribute("width", bgW);
  lbg.setAttribute("height", bgH);
  lbg.setAttribute("fill", zone.color);
  lbg.setAttribute("fill-opacity", zone.opacity);
  lbg.setAttribute("stroke", zone.color);
  lbg.setAttribute("stroke-opacity", Math.min(1, zone.opacity + 0.3));
  lbg.setAttribute("stroke-width", "1.5");
  lbg.setAttribute("rx", 3);
  lg.appendChild(lbg);

  lines.forEach((line, li) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", zone.lx + bgW / 2);
    t.setAttribute("y", zone.ly + lineH * (li + 0.85) + 3);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, sans-serif");
    t.setAttribute("font-size", li === 0 ? fontSize : Math.max(7, fontSize - 2));
    t.setAttribute("font-weight", li === 0 ? "700" : "400");
    t.setAttribute("fill", "#000000");
    t.style.pointerEvents = "none";
    t.textContent = line;
    lg.appendChild(t);
  });

  lg.addEventListener("click", (e) => {
    e.stopPropagation();
    if (e.shiftKey) {
      toggleMultiSelect(zone.id);
    } else {
      clearMultiSelect();
      selectZone(zone.id);
    }
  });
  svg.appendChild(lg);
}

function removeZoneFromSVG(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
  const lbl = document.getElementById(id + "-label");
  if (lbl) lbl.remove();
  const ln = document.getElementById(id + "-line");
  if (ln) ln.remove();
}

function refreshZone(zone) {
  removeZoneFromSVG(zone.id);
  renderZone(zone);
}

// ============================================================
// SELECTION
// ============================================================
function selectZone(id) {
  selectedZoneId = id;
  
  // Update SVG selection styling
  document.querySelectorAll(".zone-group rect.zone-rect").forEach(r => r.classList.remove("selected"));
  const el = document.getElementById(id);
  if (el) el.querySelector(".zone-rect").classList.add("selected");
  
  // Update sidebar
  renderSidebar();
  
  // Update properties panel
  const zone = zones.find(z => z.id === id);
  if (zone) {
    document.getElementById("prop-brand").value = zone.brand;
    document.getElementById("prop-sku").value = zone.sku || "";
    document.getElementById("prop-color").value = zone.color;
    const ptEl = document.getElementById("prop-type-" + (zone.ztype || "S"));
    if (ptEl) ptEl.checked = true;
    const pgEl = document.getElementById("prop-gender-" + (zone.gender || "M"));
    if (pgEl) pgEl.checked = true;
    document.getElementById("properties-panel").style.display = "block";
    document.getElementById("delete-btn").style.display = "inline-block";
  }
}

function clearSelection() {
  selectedZoneId = null;
  selectedGroupId = null;
  clearMultiSelect();
  document.querySelectorAll(".zone-rect").forEach(r => r.classList.remove("selected"));
  document.getElementById("properties-panel").style.display = "none";
  document.getElementById("delete-btn").style.display = "none";
  document.getElementById("group-btn").style.display = "none";
  document.getElementById("ungroup-btn").style.display = "none";
  renderSidebar();
}

function clearMultiSelect() {
  selectedZoneIds = [];
  document.querySelectorAll(".zone-rect.multi-selected").forEach(r => r.classList.remove("multi-selected"));
  document.getElementById("group-btn").style.display = "none";
}

function toggleMultiSelect(id) {
  selectedZoneId = null;
  document.querySelectorAll(".zone-rect.selected").forEach(r => r.classList.remove("selected"));
  document.getElementById("properties-panel").style.display = "none";
  document.getElementById("delete-btn").style.display = "none";

  const idx = selectedZoneIds.indexOf(id);
  const el = document.getElementById(id);
  const rect = el ? el.querySelector(".zone-rect") : null;
  if (idx === -1) {
    selectedZoneIds.push(id);
    if (rect) rect.classList.add("multi-selected");
  } else {
    selectedZoneIds.splice(idx, 1);
    if (rect) rect.classList.remove("multi-selected");
  }
  document.getElementById("group-btn").style.display = selectedZoneIds.length >= 2 ? "inline-block" : "none";
}

svg.addEventListener("click", (e) => {
  if (e.target === svg) clearSelection();
});

// ============================================================
// UPDATE ZONE
// ============================================================
function updateSelectedZone() {
  if (!selectedZoneId) return;
  const zone = zones.find(z => z.id === selectedZoneId);
  if (!zone) return;
  zone.brand = document.getElementById("prop-brand").value || "Бренд";
  zone.sku = parseInt(document.getElementById("prop-sku").value) || 0;
  zone.ztype = document.querySelector('input[name="prop-type"]:checked')?.value || zone.ztype || "S";
  zone.gender = document.querySelector('input[name="prop-gender"]:checked')?.value || zone.gender || "M";
  refreshZone(zone);
  renderSidebar();
  renderSummary();
}

function updateSelectedZoneColor() {
  if (!selectedZoneId) return;
  const zone = zones.find(z => z.id === selectedZoneId);
  if (!zone) return;
  zone.color = document.getElementById("prop-color").value;
  refreshZone(zone);
  renderSidebar();
  selectZone(zone.id);
}

// ============================================================
// DELETE
// ============================================================
function deleteSelected() {
  if (selectedGroupId) {
    deleteGroupById(selectedGroupId, { stopPropagation: ()=>{} });
    return;
  }
  if (!selectedZoneId) return;
  // Remove from any group
  groups.forEach(g => { g.zoneIds = g.zoneIds.filter(id => id !== selectedZoneId); });
  groups = groups.filter(g => g.zoneIds.length > 0);
  zones = zones.filter(z => z.id !== selectedZoneId);
  removeZoneFromSVG(selectedZoneId);
  clearSelection();
  renderSidebar();
  renderSummary();
}

function deleteGroupById(gid, e) {
  e.stopPropagation();
  const group = groups.find(g => g.id === gid);
  if (!group) return;
  removeGroupFromSVG(group.id);
  // Re-render individual labels
  group.zoneIds.forEach(id => {
    const zone = zones.find(z => z.id === id);
    if (zone) { zone.lx = undefined; zone.ly = undefined; removeZoneFromSVG(id); renderZone(zone); }
  });
  groups = groups.filter(g => g.id !== gid);
  if (selectedGroupId === gid) { selectedGroupId = null; document.getElementById("ungroup-btn").style.display = "none"; }
  renderSidebar();
}

function deleteZone(id, e) {
  e.stopPropagation();
  zones = zones.filter(z => z.id !== id);
  removeZoneFromSVG(id);
  if (selectedZoneId === id) clearSelection();
  renderSidebar();
}

// ============================================================

      <div class="zone-color-dot" style="background:${zone.color}"></div>

}

// ============================================================
// PARSE BRAND INPUT (e.g. "Nike A M" or "Adidas A W" or plain "Puma")
// ============================================================
function parseBrandInput(raw) {
  if (!raw) return { brand: "", ztype: null, gender: null };
  const parts = raw.trim().split(/\s+/);
  let brand = [], ztype = null, gender = null;
  for (const p of parts) {
    const u = p.toUpperCase();
    if (u === "A") { ztype = "A"; }
    else if (u === "S") { ztype = "S"; }
    else if (u === "M" && gender !== "W") { gender = gender === "W" ? "MW" : "M"; }
    else if (u === "W" && gender !== "M") { gender = gender === "M" ? "MW" : "W"; }
    else if (u === "MW" || u === "WM") { gender = "MW"; }
    else { brand.push(p); }
  }
  return { brand: brand.join(" "), ztype, gender };
}

// ============================================================
// SUMMARY TABLE
// ============================================================
function renderSummary() {
  const wrap = document.getElementById("summary-table-wrap");
  if (!wrap) return;
  if (zones.length === 0) {
    wrap.innerHTML = '<p style="color:#6272a4;font-size:11px;padding:8px;text-align:center;">Немає зон</p>';
    return;
  }

  // Gather brands
  const brandMap = {}; // brand -> { SM: sku, SW: sku, SMW: sku, AM: sku, AW: sku, AMW: sku }
  zones.forEach(z => {
    const b = z.brand;
    if (!brandMap[b]) brandMap[b] = { SM: 0, SW: 0, SMW: 0, AM: 0, AW: 0, AMW: 0 };
    const t = z.ztype || "S";
    const g = z.gender || "M";
    const key = t + (g === "M" ? "M" : g === "W" ? "W" : "MW");
    brandMap[b][key] += (z.sku || 0);
  });

  const brands = Object.keys(brandMap).sort();
  let totals = { SM: 0, SW: 0, SMW: 0, AM: 0, AW: 0, AMW: 0 };
  brands.forEach(b => {
    Object.keys(totals).forEach(k => totals[k] += brandMap[b][k]);
  });

  const fmt = v => v > 0 ? v : "—";

  let rows = brands.map(b => {
    const d = brandMap[b];
    return `<tr>
      <td class="brand-col">${b}</td>
      <td>${fmt(d.SM)}</td><td>${fmt(d.SW)}</td><td>${fmt(d.SMW)}</td>
      <td>${fmt(d.AM)}</td><td>${fmt(d.AW)}</td><td>${fmt(d.AMW)}</td>
    </tr>`;
  }).join("");

  wrap.innerHTML = `<table class="sum-table">
    <thead>
      <tr>
        <th class="brand-col" rowspan="2">Бренд</th>
        <th colspan="3">👟 Shoes</th>
        <th colspan="3">👕 Apparel</th>
      </tr>
      <tr>
        <th>M</th><th>W</th><th>M+W</th>
        <th>M</th><th>W</th><th>M+W</th>
      </tr>
    </thead>
    <tbody>
      ${rows}
      <tr class="total-row">
        <td class="brand-col">Total</td>
        <td>${totals.SM||"—"}</td><td>${totals.SW||"—"}</td><td>${totals.SMW||"—"}</td>
        <td>${totals.AM||"—"}</td><td>${totals.AW||"—"}</td><td>${totals.AMW||"—"}</td>
      </tr>
    </tbody>
  </table>`;
}

function toggleSummary() {
  const wrap = document.getElementById("summary-table-wrap");
  const tog = document.getElementById("summary-toggle");
  if (wrap.style.display === "none") {
    wrap.style.display = "block";
    tog.textContent = "▲";
    renderSummary();
  } else {
    wrap.style.display = "none";
    tog.textContent = "▼";
  }
}

// ============================================================
// BUILD SUMMARY DATA for PDF
// ============================================================
function buildSummaryData() {
  const brandMap = {};
  // Grouped zones: use group brand/type/gender, sum sku
  const groupedZoneIds = new Set(groups.flatMap(g => g.zoneIds));
  groups.forEach(group => {
    const b = group.brand;
    if (!brandMap[b]) brandMap[b] = { SM: 0, SW: 0, SMW: 0, AM: 0, AW: 0, AMW: 0 };
    const t = group.ztype || "S";
    const g = group.gender || "M";
    const key = t + (g === "M" ? "M" : g === "W" ? "W" : "MW");
    const totalSku = group.zoneIds.reduce((s, id) => { const z = zones.find(z => z.id === id); return s + (z ? (z.sku||0) : 0); }, 0);
    brandMap[b][key] += totalSku;
  });
  // Ungrouped zones
  zones.filter(z => !groupedZoneIds.has(z.id)).forEach(z => {
    const b = z.brand;
    if (!brandMap[b]) brandMap[b] = { SM: 0, SW: 0, SMW: 0, AM: 0, AW: 0, AMW: 0 };
    const t = z.ztype || "S";
    const g = z.gender || "M";
    const key = t + (g === "M" ? "M" : g === "W" ? "W" : "MW");
    brandMap[b][key] += (z.sku || 0);
  });
  const brands = Object.keys(brandMap).sort();
  let totals = { SM: 0, SW: 0, SMW: 0, AM: 0, AW: 0, AMW: 0 };
  brands.forEach(b => Object.keys(totals).forEach(k => totals[k] += brandMap[b][k]));
  return { brandMap, brands, totals };
}


// ============================================================
// GROUPS
// ============================================================
function groupSelected() {
  if (selectedZoneIds.length < 2) return;
  const ids = [...selectedZoneIds];
  const zoneObjs = ids.map(id => zones.find(z => z.id === id)).filter(Boolean);
  if (zoneObjs.length < 2) return;

  // Use first zone's brand/type/gender/color as group defaults
  const first = zoneObjs[0];
  const totalSku = zoneObjs.reduce((s, z) => s + (z.sku || 0), 0);

  const group = {
    id: "g" + Date.now(),
    zoneIds: ids,
    brand: first.brand,
    ztype: first.ztype || "S",
    gender: first.gender || "M",
    color: first.color,
    sku: totalSku,
    lx: undefined,
    ly: undefined
  };
  groups.push(group);

  // Remove individual labels & lines for grouped zones
  ids.forEach(id => {
    const lbl = document.getElementById(id + "-label");
    if (lbl) lbl.remove();
    const ln = document.getElementById(id + "-line");
    if (ln) ln.remove();
  });

  renderGroup(group);
  clearMultiSelect();
  document.querySelectorAll(".zone-rect").forEach(r => r.classList.remove("multi-selected", "selected"));
  renderSidebar();
}

function ungroupSelected() {
  if (!selectedGroupId) return;
  const group = groups.find(g => g.id === selectedGroupId);
  if (!group) return;

  // Remove group label + lines
  removeGroupFromSVG(group.id);
  groups = groups.filter(g => g.id !== selectedGroupId);

  // Re-render individual labels for each zone
  group.zoneIds.forEach(id => {
    const zone = zones.find(z => z.id === id);
    if (zone) {
      zone.lx = undefined; zone.ly = undefined; // reset to default position
      removeZoneFromSVG(id);
      renderZone(zone);
    }
  });

  selectedGroupId = null;
  document.getElementById("ungroup-btn").style.display = "none";
  renderSidebar();
}

function removeGroupFromSVG(gid) {
  const gl = document.getElementById(gid + "-label");
  if (gl) gl.remove();
  // Remove all connector lines for this group
  const group = groups.find(g => g.id === gid);
  if (group) {
    group.zoneIds.forEach((id, i) => {
      const ln = document.getElementById(gid + "-line-" + i);
      if (ln) ln.remove();
    });
  }
}

function renderGroup(group) {
  const zoneObjs = group.zoneIds.map(id => zones.find(z => z.id === id)).filter(Boolean);
  if (!zoneObjs.length) return;

  // Compute group label dimensions
  const fontSize = Math.max(9, Math.min(18, 80 / (group.brand.length * 0.65 + 2)));
  const lineH = fontSize + 3;
  const metaLine = `${group.ztype||"S"} ${group.gender||"M"}`;
  const skuLine = group.sku > 0 ? group.sku + " SKU" : null;
  const lines = [group.brand, metaLine, skuLine].filter(Boolean);
  const bgH = lines.length * lineH + 6;
  const maxLen = Math.max(...lines.map(l => l.length));
  const bgW = Math.min(160, Math.max(50, maxLen * fontSize * 0.62 + 16));

  // Default label: left of centroid
  if (group.lx === undefined) {
    const cx = zoneObjs.reduce((s, z) => s + z.x + z.w/2, 0) / zoneObjs.length;
    const cy = zoneObjs.reduce((s, z) => s + z.y + z.h/2, 0) / zoneObjs.length;
    group.lx = cx - bgW - 20;
    group.ly = cy - bgH / 2;
  }

  // Draw connector lines from group label center to each zone center
  zoneObjs.forEach((zone, i) => {
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("id", group.id + "-line-" + i);
    ln.setAttribute("class", "zone-connector");
    ln.setAttribute("x1", group.lx + bgW / 2);
    ln.setAttribute("y1", group.ly + bgH / 2);
    ln.setAttribute("x2", zone.x + zone.w / 2);
    ln.setAttribute("y2", zone.y + zone.h / 2);
    ln.setAttribute("stroke", group.color);
    ln.setAttribute("stroke-opacity", 0.7);
    ln.setAttribute("stroke-width", "1");
    ln.setAttribute("stroke-dasharray", "3,3");
    ln.style.pointerEvents = "none";
    svg.appendChild(ln);
  });

  // Draw label
  const lg = document.createElementNS("http://www.w3.org/2000/svg", "g");
  lg.setAttribute("id", group.id + "-label");
  lg.setAttribute("class", "label-group group-label");
  lg.style.cursor = "move";
  lg.style.pointerEvents = "all";

  const lbg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  lbg.setAttribute("x", group.lx);
  lbg.setAttribute("y", group.ly);
  lbg.setAttribute("width", bgW);
  lbg.setAttribute("height", bgH);
  lbg.setAttribute("fill", group.color);
  lbg.setAttribute("fill-opacity", 0.75);
  lbg.setAttribute("stroke", group.color);
  lbg.setAttribute("stroke-opacity", 0.95);
  lbg.setAttribute("stroke-width", "2");
  lbg.setAttribute("rx", 3);
  lbg.style.pointerEvents = "all";
  lg.appendChild(lbg);

  // Dot indicator showing multiple zones
  const dot1 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot1.setAttribute("cx", group.lx + bgW - 8);
  dot1.setAttribute("cy", group.ly + 7);
  dot1.setAttribute("r", 3);
  dot1.setAttribute("fill", "rgba(0,0,0,0.4)");
  dot1.style.pointerEvents = "none";
  lg.appendChild(dot1);
  const dot2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot2.setAttribute("cx", group.lx + bgW - 14);
  dot2.setAttribute("cy", group.ly + 7);
  dot2.setAttribute("r", 3);
  dot2.setAttribute("fill", "rgba(0,0,0,0.4)");
  dot2.style.pointerEvents = "none";
  lg.appendChild(dot2);

  lines.forEach((line, li) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", group.lx + bgW / 2);
    t.setAttribute("y", group.ly + lineH * (li + 0.85) + 3);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, sans-serif");
    t.setAttribute("font-size", li === 0 ? fontSize : Math.max(7, fontSize - 2));
    t.setAttribute("font-weight", li === 0 ? "700" : "400");
    t.setAttribute("fill", "#000000");
    t.style.pointerEvents = "none";
    t.textContent = line;
    lg.appendChild(t);
  });

  lg.addEventListener("click", (e) => {
    e.stopPropagation();
    selectGroup(group.id);
  });

  svg.appendChild(lg);
}

function refreshGroupLabel(group) {
  removeGroupFromSVG(group.id);
  // Recalculate SKU
  group.sku = group.zoneIds.reduce((s, id) => {
    const z = zones.find(z => z.id === id);
    return s + (z ? (z.sku || 0) : 0);
  }, 0);
  renderGroup(group);
}

function selectGroup(gid) {
  clearMultiSelect();
  selectedZoneId = null;
  selectedGroupId = gid;
  document.getElementById("properties-panel").style.display = "none";
  document.getElementById("delete-btn").style.display = "none";
  document.getElementById("ungroup-btn").style.display = "inline-block";
  document.getElementById("group-btn").style.display = "none";

  // Highlight zones in this group
  document.querySelectorAll(".zone-rect").forEach(r => r.classList.remove("selected", "multi-selected"));
  const group = groups.find(g => g.id === gid);
  if (group) {
    group.zoneIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.querySelector(".zone-rect")?.classList.add("multi-selected");
    });
  }
  renderSidebar();
}

function saveProject() {
  // Save floor plan image as base64 + all zones + groups
  const img = document.getElementById("floor-img");
  const project = {
    version: 2,
    savedAt: new Date().toISOString(),
    imgSrc: img.src,           // base64 or URL of current plan
    imgW: imgNatW,
    imgH: imgNatH,
    zones: zones,
    groups: groups
  };
  const data = JSON.stringify(project);
  const blob = new Blob([data], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  // Suggest filename with date
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.download = `floorplan_project_${dateStr}.json`;
  a.click();
}

function loadProject(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const project = JSON.parse(ev.target.result);

      // Clear current state
      zones = [];
      groups = [];
      selectedZoneId = null;
      selectedGroupId = null;
      selectedZoneIds = [];
      // Clear SVG
      const svg = document.getElementById("overlay-svg");
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      // Restore zones & groups
      zones = project.zones || [];
      groups = project.groups || [];

      // Load plan image
      if (project.imgSrc) {
        loadImageToCanvas(project.imgSrc);
        // Wait for image to load then render zones/groups
        document.getElementById("floor-img").onload = function() {
          imgNatW = project.imgW || this.naturalWidth;
          imgNatH = project.imgH || this.naturalHeight;
          const svg = document.getElementById("overlay-svg");
          svg.setAttribute("width", imgNatW);
          svg.setAttribute("height", imgNatH);
          svg.setAttribute("viewBox", `0 0 ${imgNatW} ${imgNatH}`);
          fitToWindow();
          _renderAll();
        };
      } else {
        _renderAll();
      }

      document.getElementById("upload-overlay").style.display = "none";
    } catch(err) {
      alert("Помилка завантаження проекту: " + err.message);
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be loaded again
  e.target.value = "";
}

function _renderAll() {
  // Re-render all zones (ungrouped ones get individual labels)
  const groupedIds = new Set(groups.flatMap(g => g.zoneIds));
  zones.forEach(zone => {
    renderZone(zone);
    // If zone is in a group, remove its individual label (group label will be drawn)
    if (groupedIds.has(zone.id)) {
      const lbl = document.getElementById(zone.id + "-label");
      if (lbl) lbl.remove();
      const ln = document.getElementById(zone.id + "-line");
      if (ln) ln.remove();
    }
  });
  // Re-render all groups
  groups.forEach(group => renderGroup(group));
  renderSidebar();
}

function exportData() {
  saveProject();
}

function exportImage() {
  const canvas = document.createElement("canvas");
  canvas.width = imgNatW;
  canvas.height = imgNatH;
  const ctx = canvas.getContext("2d");
  
  const img = document.getElementById("floor-img");
  ctx.drawImage(img, 0, 0, imgNatW, imgNatH);
  
  // Draw zones
  zones.forEach(zone => {
    const hex = zone.color;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);

    // Zone rectangle
    ctx.fillStyle = `rgba(${r},${g},${b},${zone.opacity})`;
    ctx.strokeStyle = `rgba(${r},${g},${b},${zone.opacity})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(zone.x, zone.y, zone.w, zone.h, 3);
    ctx.fill();
    ctx.stroke();

    // Label dimensions
    const fontSize = Math.max(12, Math.min(22, zone.w / (zone.brand.length * 0.7)));
    const lineH = fontSize + 2;
    const metaLine2 = (zone.ztype || zone.gender) ? `${zone.ztype||"S"} ${zone.gender||"M"}` : null;
    const labelParts = [zone.brand, metaLine2, zone.sku > 0 ? zone.sku + " SKU" : null].filter(Boolean);
    const bgH2 = labelParts.length * lineH + 6;
    const maxLen2 = Math.max(...labelParts.map(l => l.length));
    const bgW2 = Math.min(Math.max(zone.w * 0.8, 40), maxLen2 * fontSize * 0.62 + 16);
    const lx = zone.lx !== undefined ? zone.lx : zone.x - bgW2 - 8;
    const ly = zone.ly !== undefined ? zone.ly : zone.y + zone.h/2 - bgH2/2;

    // Connector line (dashed)
    ctx.strokeStyle = `rgba(${r},${g},${b},${zone.opacity})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(zone.x + zone.w / 2, zone.y + zone.h / 2);
    ctx.lineTo(lx + bgW2 / 2, ly + bgH2 / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Label background — same opacity as zone
    ctx.fillStyle = `rgba(${r},${g},${b},${zone.opacity})`;
    ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, zone.opacity + 0.3)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(lx, ly, bgW2, bgH2, 3);
    ctx.fill();
    ctx.stroke();

    // Label text — black
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    labelParts.forEach((part, pi) => {
      ctx.font = pi === 0 ? `bold ${fontSize}px sans-serif` : `${fontSize - 3}px sans-serif`;
      ctx.fillStyle = "#000000";
      ctx.fillText(part, lx + bgW2/2, ly + lineH * (pi + 0.85) + 3);
    });
  });
  
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "floorplan_annotated.png";
  a.click();
}

// ============================================================
// DRAG ZONE (move existing) + DRAG LABEL
// ============================================================
let dragState = null;

svg.addEventListener("mousedown", (e) => {
  if (isDrawing) return;
  if (e.shiftKey) return; // let click handle multi-select

  // Check if clicking a label
  const lg = e.target.closest(".label-group");
  if (lg) {
    // Group label?
    if (lg.classList.contains("group-label")) {
      const gid = lg.id.replace("-label", "");
      const group = groups.find(g => g.id === gid);
      if (!group) return;
      const coords = getSVGCoords(e);
      dragState = { type: "group-label", groupId: gid, startX: coords.x, startY: coords.y, origLx: group.lx, origLy: group.ly };
      e.stopPropagation();
      return;
    }
    const zoneId = lg.id.replace("-label", "");
    const zone = zones.find(z => z.id === zoneId);
    if (!zone) return;
    const coords = getSVGCoords(e);
    dragState = {
      type: "label",
      zoneId,
      startX: coords.x,
      startY: coords.y,
      origLx: zone.lx,
      origLy: zone.ly
    };
    e.stopPropagation();
    return;
  }

  // Check if clicking a zone rect
  const rect = e.target.closest(".zone-rect");
  if (!rect) return;
  const g = rect.closest(".zone-group");
  const zoneId = g.id;
  const zone = zones.find(z => z.id === zoneId);
  if (!zone) return;
  const coords = getSVGCoords(e);
  dragState = {
    type: "zone",
    zoneId,
    startX: coords.x,
    startY: coords.y,
    origX: zone.x,
    origY: zone.y,
    origLx: zone.lx,
    origLy: zone.ly
  };
  e.stopPropagation();
}, true);

svg.addEventListener("mousemove", (e) => {
  if (!dragState || isDrawing) return;
  const coords = getSVGCoords(e);

  const dx = coords.x - dragState.startX;
  const dy = coords.y - dragState.startY;

  if (dragState.type === "group-label") {
    const group = groups.find(g => g.id === dragState.groupId);
    if (!group) return;
    group.lx = dragState.origLx + dx;
    group.ly = dragState.origLy + dy;
    refreshGroupLabel(group);
    return;
  }

  const zone = zones.find(z => z.id === dragState.zoneId);
  if (!zone) return;

  if (dragState.type === "label") {
    zone.lx = dragState.origLx + dx;
    zone.ly = dragState.origLy + dy;
    // Only refresh label
    const lbl = document.getElementById(zone.id + "-label");
    if (lbl) lbl.remove();
    // Re-append label only (lightweight)
    _renderLabel(zone);
  } else {
    zone.x = dragState.origX + dx;
    zone.y = dragState.origY + dy;
    // Move label with zone
    zone.lx = (dragState.origLx !== undefined ? dragState.origLx + dx : zone.x + zone.w/2 - 30);
    zone.ly = (dragState.origLy !== undefined ? dragState.origLy + dy : zone.y + zone.h/2 - 15);
    // Update connector line anchor (zone center)
    const lineEl = document.getElementById(zone.id + "-line");
    if (lineEl) {
      lineEl.setAttribute("x1", zone.x + zone.w / 2);
      lineEl.setAttribute("y1", zone.y + zone.h / 2);
    }
    refreshZone(zone);
    if (zone.id === selectedZoneId) selectZone(zone.id);
  }
});

svg.addEventListener("mouseup", () => {
  dragState = null;
});

// Lightweight label-only re-render (also updates connector line)
function _renderLabel(zone) {
  const fontSize = Math.max(9, Math.min(18, zone.w / (zone.brand.length * 0.65 + 2)));
  const lineH = fontSize + 3;
  const metaLine = (zone.ztype || zone.gender) ? `${zone.ztype||"S"} ${zone.gender||"M"}` : null;
  const lines = [zone.brand, metaLine, zone.sku > 0 ? zone.sku + " SKU" : null].filter(Boolean);
  const bgH = lines.length * lineH + 6;
  const maxLen = Math.max(...lines.map(l => l.length));
  const bgW = Math.min(Math.max(zone.w * 0.8, 40), maxLen * fontSize * 0.62 + 16);

  // Update connector line endpoints
  const lineEl = document.getElementById(zone.id + "-line");
  if (lineEl) {
    lineEl.setAttribute("x2", zone.lx + bgW / 2);
    lineEl.setAttribute("y2", zone.ly + bgH / 2);
  }

  const lg = document.createElementNS("http://www.w3.org/2000/svg", "g");
  lg.setAttribute("id", zone.id + "-label");
  lg.setAttribute("class", "label-group");
  lg.style.cursor = "move";

  const lbg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  lbg.setAttribute("x", zone.lx);
  lbg.setAttribute("y", zone.ly);
  lbg.setAttribute("width", bgW);
  lbg.setAttribute("height", bgH);
  lbg.setAttribute("fill", zone.color);
  lbg.setAttribute("fill-opacity", zone.opacity);
  lbg.setAttribute("stroke", zone.color);
  lbg.setAttribute("stroke-opacity", Math.min(1, zone.opacity + 0.3));
  lbg.setAttribute("stroke-width", "1.5");
  lbg.setAttribute("rx", 3);
  lg.appendChild(lbg);

  lines.forEach((line, li) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", zone.lx + bgW / 2);
    t.setAttribute("y", zone.ly + lineH * (li + 0.85) + 3);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, sans-serif");
    t.setAttribute("font-size", li === 0 ? fontSize : Math.max(7, fontSize - 2));
    t.setAttribute("font-weight", li === 0 ? "700" : "400");
    t.setAttribute("fill", "#000000");
    t.style.pointerEvents = "none";
    t.textContent = line;
    lg.appendChild(t);
  });

  lg.addEventListener("click", (e) => { e.stopPropagation(); selectZone(zone.id); });
  svg.appendChild(lg);
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener("keydown", (e) => {
  if (e.key === "Delete" || e.key === "Backspace") {
    if (!["INPUT","TEXTAREA"].includes(e.target.tagName)) deleteSelected();
  }
  if (e.key === "Escape") clearSelection();
});

// ============================================================
// DRAG & DROP file
// ============================================================
const uploadBox = document.getElementById("upload-box");
uploadBox.addEventListener("dragover", e => { e.preventDefault(); uploadBox.classList.add("drag-over"); });
uploadBox.addEventListener("dragleave", () => uploadBox.classList.remove("drag-over"));
uploadBox.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadBox.classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (!file) return;
  document.getElementById("upload-overlay").style.display = "none";
  if (file.type === "application/pdf") {
    const fr = new FileReader();
    fr.onload = ev => renderPdfToCanvas(ev.target.result);
    fr.readAsArrayBuffer(file);
  } else {
    loadImageToCanvas(URL.createObjectURL(file));
  }
});
</script>
</body>
